name: CI

on:
  push:
  pull_request:

jobs:
  static-analysis:
    name: "C++ Static Analysis"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18 ninja-build
      - name: Analyze project sources
        env:
          CLANG_TIDY_JOBS: "2"
        run: bash scripts/run_static_analysis.sh "$RUNNER_TEMP/onboard-autonomy-tidy"

  native-linux:
    name: "Linux Build & Tests"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r python/requirements-dev.txt
      - name: Analyze Python sources
        run: ruff check python scripts
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Prepare test reports
        run: mkdir -p artifacts/ci
      - name: Test C++
        run: >-
          ctest --test-dir build --output-on-failure
          --output-junit "$PWD/artifacts/ci/cpp-tests.xml"
          2>&1 | tee artifacts/ci/cpp-tests.log
      - name: Test Python scenarios
        run: >-
          python -m unittest discover -s python/tests -v
          2>&1 | tee artifacts/ci/python-tests.log
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-linux-test-reports
          path: artifacts/ci/
          if-no-files-found: error
          retention-days: 14

  arm64-build:
    name: "ARM64 Cross-Build"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install cross compiler
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          g++-aarch64-linux-gnu
          g++-12-aarch64-linux-gnu
          ninja-build
      - name: Configure ARM64
        run: >-
          cmake -S . -B build-arm64 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/aarch64-linux-gnu.cmake
          -DBUILD_TESTING=OFF
      - name: Build ARM64
        run: cmake --build build-arm64
      - name: Describe ARM64 binary
        run: |
          mkdir -p artifacts/ci-arm64
          file build-arm64/onboard_autonomy |
            tee artifacts/ci-arm64/binary-info.txt
          sha256sum build-arm64/onboard_autonomy |
            tee artifacts/ci-arm64/sha256.txt
      - name: Upload ARM64 release candidate
        uses: actions/upload-artifact@v7
        with:
          name: onboard_autonomy-linux-arm64
          path: |
            build-arm64/onboard_autonomy
            artifacts/ci-arm64/
          if-no-files-found: error
          retention-days: 14
