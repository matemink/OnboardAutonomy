<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OnboardAutonomy Vision</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Lucida Console", "Cascadia Mono", monospace;
      --ink: #eef3ee;
      --muted: #85918e;
      --panel: #101817;
      --panel-strong: #0a100f;
      --line: #263532;
      --live: #53e6a8;
      --target: #49d9ff;
      --forward: #ffbd5c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      background:
        radial-gradient(circle at 18% 0%, #203b35 0, transparent 36%),
        linear-gradient(145deg, #070b0b, #0c1211 58%, #101a18);
      color: var(--ink);
    }

    main {
      width: min(1500px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .page-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 4px;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(20px, 3vw, 30px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h2 {
      font-size: 14px;
      letter-spacing: 0.12em;
    }

    .eyebrow,
    .page-note {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .eyebrow {
      margin-bottom: 7px;
    }

    .camera-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .camera-grid.single-stream {
      grid-template-columns: minmax(0, 1fr);
    }

    .camera-card[hidden] {
      display: none;
    }

    .camera-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      background: rgb(10 16 15 / 88%);
      box-shadow: 0 24px 70px rgb(0 0 0 / 36%);
    }

    .card-header,
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
    }

    .card-header {
      border-bottom: 1px solid var(--line);
    }

    .camera-role {
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    .badge.live {
      color: var(--live);
    }

    .badge.live .dot {
      background: var(--live);
      box-shadow: 0 0 14px var(--live);
    }

    .viewer {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(rgb(255 255 255 / 2%) 1px, transparent 1px),
        linear-gradient(90deg, rgb(255 255 255 / 2%) 1px, transparent 1px),
        #050808;
      background-size: 24px 24px;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
    }

    .waiting {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      line-height: 1.6;
      text-align: center;
      pointer-events: none;
    }

    .waiting.hidden {
      display: none;
    }

    .scanline {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        180deg,
        transparent 0,
        transparent 3px,
        rgb(0 0 0 / 8%) 4px
      );
    }

    .card-footer {
      min-height: 62px;
      align-items: flex-start;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      line-height: 1.55;
    }

    .camera-card[data-stream="downward"] h2,
    .camera-card[data-stream="downward"] .analysis {
      color: var(--target);
    }

    .camera-card[data-stream="forward"] h2,
    .camera-card[data-stream="forward"] .analysis {
      color: var(--forward);
    }

    .analysis {
      max-width: 58%;
      text-align: right;
    }

    @media (max-width: 900px) {
      .camera-grid {
        grid-template-columns: 1fr;
      }

      .page-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 12px;
      }

      .card-footer {
        flex-direction: column;
      }

      .analysis {
        max-width: none;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="page-header">
      <div>
        <p class="eyebrow">Camera Preview</p>
        <h1>OnboardAutonomy Vision</h1>
      </div>
      <p class="page-note">Loading camera configuration</p>
    </header>

    <section class="camera-grid">
      <article class="camera-card" data-stream="forward" hidden>
        <header class="card-header">
          <div>
            <h2>Front Camera</h2>
            <p class="camera-role">Forward search view / UDP 5602</p>
          </div>
          <div class="badge">
            <span class="dot"></span>
            <span class="status-text">WAITING</span>
          </div>
        </header>
        <div class="viewer">
          <canvas width="640" height="480"></canvas>
          <div class="waiting">WAITING FOR FORWARD CAMERA</div>
          <div class="scanline"></div>
        </div>
        <footer class="card-footer">
          <div class="frame">NO FRAME</div>
          <div class="analysis">OBSERVATION ONLY</div>
        </footer>
      </article>

      <article class="camera-card" data-stream="downward" hidden>
        <header class="card-header">
          <div>
            <h2>Down Camera</h2>
            <p class="camera-role">Downward observation / UDP 5601</p>
          </div>
          <div class="badge">
            <span class="dot"></span>
            <span class="status-text">WAITING</span>
          </div>
        </header>
        <div class="viewer">
          <canvas width="640" height="480"></canvas>
          <div class="waiting">WAITING FOR DOWNWARD CAMERA</div>
          <div class="scanline"></div>
        </div>
        <footer class="card-footer">
          <div class="frame">NO FRAME</div>
          <div class="analysis">OBSERVATION ONLY</div>
        </footer>
      </article>
    </section>
  </main>

  <script>

    function createStream(card) {
      const stream = card.dataset.stream;
      const canvas = card.querySelector("canvas");
      const context = canvas.getContext("2d");
      const badge = card.querySelector(".badge");
      const statusText = card.querySelector(".status-text");
      const waiting = card.querySelector(".waiting");
      const frameText = card.querySelector(".frame");
      const analysisText = card.querySelector(".analysis");
      let imageData = null;
      let nextPollDelay = 100;

      function setOffline(message) {
        badge.classList.remove("live");
        statusText.textContent = message;
        waiting.classList.remove("hidden");
        nextPollDelay = 600;
      }

      async function update() {
        try {
          const response = await fetch(
            `/api/frame/${stream}?t=${Date.now()}`,
            { cache: "no-store" }
          );
          if (response.status === 204) {
            setOffline("WAITING FOR FRAME");
            return;
          }
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const width = Number(response.headers.get("X-Frame-Width"));
          const height = Number(response.headers.get("X-Frame-Height"));
          const sequence = response.headers.get("X-Frame-Sequence");
          const yuv420 = new Uint8Array(await response.arrayBuffer());
          const lumaSize = width * height;
          const chromaWidth = width / 2;
          const chromaSize = chromaWidth * (height / 2);
          if (yuv420.length !== lumaSize + chromaSize * 2) {
            throw new Error("Incomplete camera frame");
          }

          if (canvas.width !== width || canvas.height !== height) {
            canvas.width = width;
            canvas.height = height;
            imageData = null;
          }
          if (imageData === null) {
            imageData = context.createImageData(width, height);
          }

          const rgba = imageData.data;
          const uOffset = lumaSize;
          const vOffset = lumaSize + chromaSize;
          for (let y = 0; y < height; y += 1) {
            const rowOffset = y * width;
            const chromaRowOffset = Math.floor(y / 2) * chromaWidth;
            for (let x = 0; x < width; x += 1) {
              const source = rowOffset + x;
              const chroma = chromaRowOffset + Math.floor(x / 2);
              const luminance = Math.max(0, yuv420[source] - 16);
              const u = yuv420[uOffset + chroma] - 128;
              const v = yuv420[vOffset + chroma] - 128;
              const destination = source * 4;
              rgba[destination] = Math.max(
                0,
                Math.min(255, (298 * luminance + 409 * v + 128) >> 8)
              );
              rgba[destination + 1] = Math.max(
                0,
                Math.min(
                  255,
                  (298 * luminance - 100 * u - 208 * v + 128) >> 8
                )
              );
              rgba[destination + 2] = Math.max(
                0,
                Math.min(255, (298 * luminance + 516 * u + 128) >> 8)
              );
              rgba[destination + 3] = 255;
            }
          }
          context.putImageData(imageData, 0, 0);
          analysisText.textContent = "OBSERVATION ONLY";

          badge.classList.add("live");
          statusText.textContent = "LIVE";
          waiting.classList.add("hidden");
          frameText.textContent =
            `${width}x${height} I420 COLOR / FRAME ${sequence}`;
          nextPollDelay = 100;
        } catch (error) {
          setOffline("OFFLINE");
          frameText.textContent = error.message.toUpperCase();
        } finally {
          window.setTimeout(update, nextPollDelay);
        }
      }

      update();
    }

    async function loadStreams() {
      const note = document.querySelector(".page-note");
      try {
        const response = await fetch("/api/streams", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const streams = await response.json();
        const cards = Array.from(document.querySelectorAll(".camera-card"))
          .filter((card) => streams.includes(card.dataset.stream));
        document.querySelector(".camera-grid")
          .classList.toggle("single-stream", cards.length === 1);
        note.textContent = cards.length === 1
          ? "One camera stream" : "Independent streams / independent health";
        for (const card of cards) {
          card.hidden = false;
          createStream(card);
        }
      } catch (error) {
        note.textContent = `Camera configuration unavailable: ${error.message}`;
        window.setTimeout(loadStreams, 1000);
      }
    }

    loadStreams();
  </script>
</body>
</html>
